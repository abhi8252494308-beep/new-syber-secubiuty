services:
  - type: web
    name: securesite-audit-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: DATABASE_URL
        fromDatabase:
          name: securesite-audit-db
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: securesite_audit
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://securesite-audit-frontend.onrender.com", "http://localhost:3000"]'
      - key: API_V1_PREFIX
        value: /api/v1
      - key: REDIS_URL
        fromService:
          type: redis
          name: securesite-audit-redis
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@securesite-audit.com
      - key: APP_NAME
        value: SecureSite Audit
      - key: APP_URL
        value: https://securesite-audit-backend.onrender.com
      - key: DEBUG
        value: "false"
      - key: AUDIT_TIMEOUT_SECONDS
        value: "120"
      - key: MAX_CONCURRENT_AUDITS
        value: "5"
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: securesite-audit-db
    databaseName: securesite_audit
    user: securesite
    plan: free
    region: oregon

  - name: securesite-audit-redis
    type: redis
    plan: free
    region: oregon